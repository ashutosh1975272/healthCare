# Local stack wired to ONLINE services (Neon Postgres + Upstash Redis).
# The api + livekit-agent read .env.online (gitignored). Local postgres/redis
# from docker-compose.yml are NOT started here — do not merge the two files.
# Usage: docker compose -f docker-compose.local-online.yml up -d --build api
# Frontend runs separately: npm run dev (frontend/.env.local -> localhost:8000).

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data_local:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aarogya-local

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123;
      mc mb --ignore-existing local/aarogya-reports;
      mc mb --ignore-existing local/aarogya-private;
      exit 0;
      "
    networks:
      - aarogya-local

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
    networks:
      - aarogya-local

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.online
    depends_on:
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - aarogya-local

  # Realtime voice worker (outbound WebRTC to LiveKit Cloud).
  # Shares DATABASE_URL + SECRET_KEY with api via .env.online.
  livekit-agent:
    build:
      context: ./backend/livekit-agent
      dockerfile: Dockerfile
    env_file:
      - .env.online
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - aarogya-local

volumes:
  minio_data_local:

networks:
  aarogya-local:
    driver: bridge
