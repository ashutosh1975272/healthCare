# VPS production stack for Aarogya (single host, Docker Compose).
# Usage: docker compose -f docker-compose.vps.yml up -d --build
# Managed data plane (Neon Postgres + Upstash Redis) comes from .env.vps
# (copy .env.vps.example and fill in values; never commit it).
# Local testing uses docker-compose.local-online.yml + npm run dev instead.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aarogya
    profiles:
      - storage

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minio} $${MINIO_ROOT_PASSWORD:-minio123};
      mc mb --ignore-existing local/aarogya-reports;
      mc mb --ignore-existing local/aarogya-private;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    networks:
      - aarogya
    profiles:
      - storage

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.vps
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET_REPORTS: aarogya-reports
      MINIO_BUCKET_PRIVATE: aarogya-private
      MINIO_SECURE: "false"
      APP_ENV: production
      OTP_DEV_MODE: "false"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - aarogya

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env.vps
    environment:
      APP_ENV: production
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - aarogya

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env.vps
    environment:
      APP_ENV: production
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - celery
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - aarogya

  # Realtime voice worker: outbound WebRTC to LiveKit Cloud, no inbound
  # ports. Replaces the Render free worker (OOM) and stays always-on.
  livekit-agent:
    build:
      context: ./backend/livekit-agent
      dockerfile: Dockerfile
    env_file:
      - .env.vps
    dns:
      - 8.8.8.8
      - 8.8.4.4
    expose:
      - "7860"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860').read(1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - aarogya

  # Manual HTTPS only (port 80 is taken on this host).
  # Certs are issued by certbot on the host and mounted read-only below.
  # Telegram webhooks and the Vercel BFF both require HTTPS: the API is
  # served on ${HTTPS_PORT} (20354) and Telegram's allowed port 8443.
  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.vps
    ports:
      - "${HTTPS_PORT:-20354}:443"
      - "8443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AAROGYA_CERTS_DIR:-~/aarogya-certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aarogya

  # Self-hosted frontend mirror (Vercel is the primary UI).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file:
      - .env.vps
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "20356:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aarogya

volumes:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  aarogya:
    driver: bridge
